name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build (optional; defaults to current ref)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Test, lint, and build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Verify APK signature and prepare release assets
        id: assets
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Signed release APK not found at $APK_SRC"
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_SRC"
          fi

          OUT_DIR="release-assets"
          mkdir -p "$OUT_DIR"
          APK_NAME="realme-unlink-${VERSION}.apk"
          cp "$APK_SRC" "$OUT_DIR/$APK_NAME"
          (cd "$OUT_DIR" && sha256sum "$APK_NAME" > sha256sum.txt)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$(cat "$OUT_DIR/sha256sum.txt")" >> "$GITHUB_OUTPUT"

      - name: Upload release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: realme-unlink-${{ steps.assets.outputs.version }}
          path: release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.assets.outputs.version }}"
          CHECKSUM="${{ steps.assets.outputs.checksum }}"
          APK_PATH="release-assets/${{ steps.assets.outputs.apk_name }}"
          SUM_PATH="release-assets/sha256sum.txt"

          NOTES="$(printf '### Checksums\n\n```\n%s\n```' "$CHECKSUM")"

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$APK_PATH" "$SUM_PATH" --clobber
          else
            gh release create "$VERSION" "$APK_PATH" "$SUM_PATH" \
              --title "Realme Unlink ${VERSION}" \
              --generate-notes \
              --notes "$NOTES"
          fi

      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.jks
